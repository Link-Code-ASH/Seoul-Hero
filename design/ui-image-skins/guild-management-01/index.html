<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>서울 히어로 길드 본부 시안</title><style>body{margin:0;background:#122335;color:#f7f8fb;font:16px system-ui}main{max-width:1080px;margin:24px auto;padding:0 18px}h1{font-size:28px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button{font:inherit;padding:12px;color:#17324b;background:#e7ecec;border:0;border-radius:8px;cursor:pointer}button.active{background:#ade9d9}img{width:100%;height:auto}p{line-height:1.7;color:#cbd8e4}.sheet{display:none}small{color:#a6bed0}</style><main><h1>서울 히어로 · 길드 본부</h1><p>915×412 Godot 시안 · 방을 눌러 운영 · 건물과 주요 조작은 한 화면 · 긴 목록은 오른쪽 상세창 안에서 스크롤</p><nav id="nav"></nav><img id="screen" alt="길드 본부 실제 Godot 시안"><p id="caption"></p><details><summary>시설 Lv.1 / 4 / 7 / 10 소재</summary><img src="rooms.png" alt="8개 시설 4단계 외형"></details><p><small>독립 메모리 상태로 캡처했습니다. 2026-10-04 사용자 승인을 받아 현재 워크트리의 Godot 길드 본부와 편의점 조합창에 연결했습니다.</small></p></main><script>const screens=[['01-office','시작 사무소','운영실과 빈 방 3칸. 직원 2명이 이동하고 운영실 Lv.3에서 2층을 개방합니다.'],['02-building','2층·8개 시설','시설은 각각 한 개. 공사 중에도 기존 장비와 기능을 유지하고 골조·직원 작업을 함께 표시합니다.'],['03-production','생산 채널','코인과 캐릭터·무기·축복 지정 채널을 동시에 운영합니다. 상세창을 내부 스크롤해 생산 대상을 고릅니다.'],['04-staff','직원 배치','직무·특기·레벨을 읽고 배치·교육·선택 채용합니다. 예약 작업 중인 직원은 배치를 변경할 수 없습니다.'],['05-expedition','탐험 파견','행선지와 직원을 선택합니다. 30분·2시간·8시간 파견은 기본 보상과 희귀 설계도를 제공합니다.'],['06-jobs','작업·가속','작업별 남은 시간을 확인하고 가속권 또는 길드 코인으로 단축합니다.'],['07-workshop','장비공방','상품 영구 강화·등장 제외·설계도 조합법을 운영합니다.'],['08-crafting','전투 중 조합','편의점에서 보유 재료를 정확히 소비하고 결과를 만듭니다.']];function show(i){screen.src=screens[i][0]+'.png';caption.textContent=screens[i][2];[...nav.children].forEach((b,j)=>b.classList.toggle('active',i===j))}screens.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s[1];b.onclick=()=>show(i);nav.appendChild(b)});show(0)</script></html>
