<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서울 히어로 · 일시정지 UI 시안</title>
  <style>
    @font-face {
      font-family: Paperlogy;
      src: url('/godot/assets/ui/fonts/Paperlogy-4Regular.ttf') format('truetype');
      font-weight: 400;
      font-display: block;
    }
    @font-face {
      font-family: Paperlogy;
      src: url('/godot/assets/ui/fonts/Paperlogy-6SemiBold.ttf') format('truetype');
      font-weight: 600;
      font-display: block;
    }
    @font-face {
      font-family: Paperlogy;
      src: url('/godot/assets/ui/fonts/Paperlogy-8ExtraBold.ttf') format('truetype');
      font-weight: 800;
      font-display: block;
    }
    @font-face {
      font-family: Barlow;
      src: url('/godot/assets/ui/fonts/BarlowCondensed-Bold.ttf') format('truetype');
      font-weight: 700;
      font-display: block;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #0f192a; font-family: Paperlogy, sans-serif; }
    .canvas {
      position: absolute;
      left: 50%; top: 50%;
      width: 915px; height: 412px;
      transform: translate(-50%, -50%) scale(var(--scale, 1));
      transform-origin: center;
      overflow: hidden;
    }
    .combat { position: absolute; inset: 0; width: 915px; height: 412px; object-fit: cover; }
    .veil { position: absolute; inset: 0; background: rgba(15, 25, 42, .48); }
    .panel {
      position: absolute;
      left: 252px; top: 52px; width: 410px; height: 308px;
      background: url('/design/ui-image-skins/pause-glass-01/pause-panel.png') center / contain no-repeat;
    }
    .title {
      position: absolute;
      left: 282px; top: 76px; margin: 0;
      font-size: 26px; line-height: 34px; font-weight: 800; color: #243448;
    }
    .status {
      position: absolute;
      left: 559px; top: 84px; width: 73px;
      color: #c64f5f; font-family: Barlow, sans-serif; font-size: 16px;
      line-height: 20px; font-weight: 700; letter-spacing: 1.2px; text-align: right;
    }
    .information {
      position: absolute;
      left: 280px; top: 126px; width: 354px; height: 66px;
      border: 6px solid transparent;
      border-image: url('/design/ui-image-skins/office-day-01/menu-unified-01/assets/glass_row.png') 24 fill / 6px;
    }
    .location {
      position: absolute;
      left: 298px; top: 139px; margin: 0;
      color: #243448; font-size: 16px; line-height: 22px; font-weight: 600;
    }
    .depth {
      position: absolute;
      left: 298px; top: 162px; margin: 0;
      color: #657787; font-size: 14px; line-height: 18px; font-weight: 400;
    }
    .wave-number {
      position: absolute;
      left: 518px; top: 132px; width: 98px; margin: 0;
      color: #243448; font-family: Barlow, sans-serif; font-size: 26px;
      line-height: 32px; font-weight: 700; text-align: right;
    }
    .wave-label {
      position: absolute;
      left: 518px; top: 165px; width: 98px; margin: 0;
      color: #657787; font-size: 12px; line-height: 17px; text-align: right;
    }
    .action {
      position: absolute;
      left: 280px; width: 354px;
      padding: 0; display: flex; align-items: center; justify-content: center;
      border: 6px solid transparent;
      font-family: Paperlogy, sans-serif; font-size: 16px;
      font-weight: 600; line-height: 22px; background: none;
    }
    .resume {
      top: 212px; height: 48px; color: #fff;
      border-image: url('/design/ui-image-skins/pause-glass-01/continue-soft-blue-02.png') 12.5% 14.0625% fill / 5px 18px;
    }
    .quit {
      top: 269px; height: 44px; color: #c64f5f;
      border-image: url('/design/ui-image-skins/office-day-01/menu-unified-01/assets/glass_button.png') 20 72 fill / 5px 18px;
    }
  </style>
</head>
<body>
  <main class="canvas" aria-label="서울 히어로 일시정지 화면 시안">
    <img class="combat" src="/design/ui-image-skins/vfx-reborn-01/slash.png" alt="광화문 광장의 정지된 전투 화면">
    <div class="veil" aria-hidden="true"></div>
    <div class="panel" aria-hidden="true"></div>
    <h1 class="title">일시정지</h1>
    <span class="status">PAUSED</span>
    <div class="information" aria-hidden="true"></div>
    <p class="location">광화문 광장</p>
    <p class="depth">6층</p>
    <p class="wave-number">1 / 20</p>
    <p class="wave-label">웨이브</p>
    <button class="action resume" type="button">계속하기</button>
    <button class="action quit" type="button">출동 종료</button>
  </main>
  <script>
    function fitCanvas() {
      document.documentElement.style.setProperty('--scale', Math.min(innerWidth / 915, innerHeight / 412));
    }
    addEventListener('resize', fitCanvas);
    fitCanvas();
  </script>
</body>
</html>
