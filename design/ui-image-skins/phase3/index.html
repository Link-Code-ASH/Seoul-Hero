<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>서울 히어로 · 독립 UI 시안</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9eff2;color:#243448;font-family:Paperlogy,system-ui,sans-serif}@font-face{font-family:Paperlogy;src:url('../fonts/Paperlogy-4Regular.ttf')}@font-face{font-family:BMJUA;src:url('../fonts/BMJUA.ttf')}header,main{max-width:995px;margin:auto;padding:20px 40px}h1{font:30px BMJUA;margin:0 0 8px}p{font-size:14px;line-height:1.6;margin:6px 0 14px}nav{display:flex;flex-wrap:wrap;gap:6px}button{font:14px Paperlogy;padding:10px 12px;border:1px solid #a7bac5;border-radius:4px;color:#243448;background:#f9fbfc;cursor:pointer}button[aria-current=true]{background:#d3eee7;border-color:#267f75}main{padding-top:0}.image{display:block;width:100%;height:auto;box-shadow:0 5px 18px #24344820}h2{font:25px BMJUA;margin:14px 0 5px}footer{max-width:995px;margin:auto;padding:0 40px 30px;font-size:13px;line-height:1.6}a{color:#246b81}.controls{display:flex;gap:8px;margin:16px 0}select{font:14px Paperlogy;flex:1;color:#243448;background:#f9fbfc;border:1px solid #a7bac5}details{margin-top:20px}#all{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}#all a{font-size:13px;display:block;text-decoration:none}#all img{width:100%;display:block}@media(max-width:700px){header,main,footer{padding-left:12px;padding-right:12px}nav button{font-size:13px}#all{grid-template-columns:repeat(2,1fr)}}</style>
<header><h1>서울 히어로 · 독립 UI 시안</h1><p>915×412 기준 · 제작한 PNG 소재 + 실제 B안 글꼴 + 기존 원화<br>컨펌용 정적 시안입니다. 게임 런타임·저장·전투·구매 연결은 변경하지 않았습니다.</p><nav id="nav"></nav></header>
<main><h2 id="title"></h2><p id="caption"></p><a id="full" target="_blank"><img class="image" id="screen" alt=""></a><div class="controls"><button id="prev">← 이전 시안</button><select id="select" aria-label="독립 화면 선택"></select><button id="next">다음 시안 →</button></div><p>이미지를 누르면 원본 크기로 열립니다. 각 게임 화면은 서로 합치지 않고 독립 파일로 제작했습니다.</p><details><summary>전체 시안 목록과 PNG 원본</summary><div id="all"></div></details></main>
<footer><a href="REPORT.md">비교 보고·수정 방향</a> · <a href="QA.md">확인 범위</a> · <a href="materials.json">9분할·안전 여백</a> · <a href="PROMPTS.md">프롬프트·출처</a><br>타이틀·로비·상점의 승인된 구현은 유지합니다. 새 화면의 게임 연결은 해당 시안의 명시적 컨펌 후 진행합니다.</footer>
<script>const screens=[["01-hud","평상시 전투 HUD","왼쪽 위 HP·재화·무기 6개, 중앙 웨이브·시간. 박스·초상·하단 슬롯판 없음."],["02-materials","새 PNG 소재 8종","안내판·인물 발판·장비 진열대·청자·도감·콘솔·작전 알림·버튼."],["03-map","맵 선택","실제 광화문 원화가 중심. 다른 선택 화면과 분리."],["04-depth","심도 선택","1~20 번호와 클리어·선택·도전·잠금. 의미 없는 게이트 삽화 없음."],["05-character","각성자 선택","실제 빈손 SD 4종과 발판. 큰 액자 없이 인물이 중심."],["06-weapon","시작 무기 선택","실제 시작 무기 7종의 장비 진열. 전투 보유 한도 6슬롯과 구분."],["07-blessing","단군의 축복 선택","축복 없음·7종·해금 상태. 출동 전 선택이며 영구 성장과 분리."],["08-formation","편성 확인","지역·심도·각성자·시작 무기·축복·주간 규칙을 별도 화면에서 확인."],["09-growth","영구 성장","실제 축복 조각·단계·가격. 청자·금색 소재, 출동 선택과 다른 목적."],["10-archive","자료집","실제 수집물 썸네일과 선택 원화. 금고 장부의 조건·효과·패널티·가격·상한."],["11-settings","설정","청회색 콘솔과 정렬된 조작 행. 민트 활성, 기본 음량 80/50/72/78."],["12-pause","일시정지","평상시 HUD와 별도 시안. 작전 알림 소재와 계속하기·출동 종료."],["13-hud-low-hp","확인용: 큰 재화·낮은 HP","HP 17/100, 현재 마력석 987,654, 미회수 12,480, 무기 6개."],["14-archive-phoenix","확인용: 불사 성냥","한 판 1회 치명적 피해 생존·2.5초 무적·최대 체력 -10·가격 96·상한 1."]];let index=0;const nav=document.querySelector('#nav'),sel=document.querySelector('#select');screens.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s[1];b.onclick=()=>show(i);nav.append(b);const o=new Option(s[1],i);sel.add(o);const a=document.createElement('a');a.href='captures/'+s[0]+'.png';a.target='_blank';const im=document.createElement('img');im.src=a.href;im.alt=s[1];a.append(im,document.createTextNode(s[1]));document.querySelector('#all').append(a)});function show(i){index=(i+screens.length)%screens.length;const s=screens[index];document.querySelector('#title').textContent=s[1];document.querySelector('#caption').textContent=s[2];document.querySelector('#screen').src='captures/'+s[0]+'.png';document.querySelector('#screen').alt=s[1];document.querySelector('#full').href='captures/'+s[0]+'.png';sel.value=index;[...nav.children].forEach((b,j)=>b.setAttribute('aria-current',j===index));history.replaceState(null,'','#'+s[0]);}sel.onchange=()=>show(+sel.value);document.querySelector('#prev').onclick=()=>show(index-1);document.querySelector('#next').onclick=()=>show(index+1);document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowLeft')show(index-1);if(e.key==='ArrowRight')show(index+1)});show(Math.max(0,screens.findIndex(s=>s[0]===location.hash.slice(1))));</script></html>
