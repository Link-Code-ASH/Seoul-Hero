<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>서울 히어로 · 원화 후보 라이브러리</title>
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <header class="app-header">
    <div class="heading"><h1>서울 히어로 · 원화 후보</h1><span class="boundary">게임 연결 없음 · 선택은 이 기기에 저장</span></div>
    <div id="progress" class="progress" aria-live="polite"></div>
    <div class="toolbar">
      <div class="view-tabs" role="tablist" aria-label="자료 종류"><button id="assets-tab" class="selected" role="tab" aria-selected="true">원화</button><button id="recipes-tab" role="tab" aria-selected="false">연출 레시피</button></div>
      <label class="search"><span class="sr-only">이름·태그·설명 검색</span><input id="search" type="search" placeholder="이름 · 태그 · 용도 검색" autocomplete="off"></label>
      <button id="export-selection">선택 내보내기</button><button id="import-selection">선택 가져오기</button><input id="import-file" type="file" accept="application/json,.json" hidden>
    </div>
  </header>
  <main class="workspace">
    <aside class="filters" aria-label="분류와 필터">
      <h2>종류</h2><div id="categories" class="category-list"></div>
      <label>제작 상태<select id="status"><option value="all">전체 상태</option><option value="complete">제작 완료</option><option value="generated-unreviewed">생성 후 검토 전</option><option value="needs-revision">수정 필요</option><option value="planned">제작 계획</option><option value="failed">생성 실패</option></select></label>
      <label>계열<select id="family"><option value="all">모든 계열</option></select></label>
      <label class="check"><input id="only-favorites" type="checkbox">즐겨찾기만</label>
      <label class="check"><input id="only-candidates" type="checkbox">선택 후보만</label>
      <div id="storage-notice" class="small muted" role="status"></div>
    </aside>
    <section class="results" aria-label="검색 결과">
      <div class="results-header"><strong id="result-count"></strong><span id="page-label" class="small muted"></span></div>
      <div id="grid" class="grid"></div>
      <nav class="pagination" aria-label="결과 페이지"><button id="previous-page">이전</button><button id="next-page">다음</button></nav>
    </section>
    <section id="detail" class="detail" aria-label="선택한 원화 상세"><div class="empty-detail"><h2>원화나 레시피를 선택하세요</h2><p>제작된 이미지와 아직 없는 계획을 구분해 표시합니다.</p></div></section>
  </main>
  <dialog id="zoom-dialog"><div class="zoom-toolbar"><strong id="zoom-title"></strong><button id="close-zoom">닫기</button></div><div id="zoom-surface" class="zoom-surface checker"><img id="zoom-image" alt="선택한 원화 원본"></div></dialog>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <script id="library-data" type="application/json">__ART_LIBRARY_CATALOG__</script>
  <script src="gallery.js"></script>
</body>
</html>
